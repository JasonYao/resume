name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo code
        uses: actions/checkout@v7

      - name: Secure CI/CD environment
        run: bin/lockdown

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"

      - name: Set up Python
        run: uv python install

      - name: Install Python dependencies
        run: uv sync --locked --all-extras --dev

      - name: Secure CI/CD environment (post Python install)
        run: bin/lockdown

      - name: Cache Texlive
        uses: actions/cache@v6
        env:
          cache-name: cache-texlive-dependencies
        with:
          path: |
            /tmp/texlive
            $HOME/.texlive
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('/tmp/texlive/package-manifest.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: sudo apt update && sudo apt -y install fonts-font-awesome ghostscript shellcheck

      - name: Install TexLive and ImageMagick dependencies
        run: source bin/install_dependencies

[project]
name = "resume"
version = "2026.10.0"
description = "Resume for Jason Yao"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Used to ease mapping from JSON to arbitrary dataclasses without
    # the need for explicit .fromDict() classes
    "dacite==1.9.1",
    # Primary templating engine used for this project
    "Jinja2==3.1.5",
    # Used to parse template data and have type-safe countries being slung around
    # (a bit overkill, but ¯\_(ツ)_/¯)
    "pycountry==24.6.1",
    # Used for finding relative dates, though could probably be removed
    # in the future
    "python-dateutil==2.9.0.post0",
    # Used to parse and get access to type-safe language codes
    # (a bit overkill, but ¯\_(ツ)_/¯)
    "iso-639==0.4.5",
    ######
    # Transitive dependencies (kept here during uv migration, to delete later)
    ######
    "MarkupSafe==3.0.2",
    "setuptools==75.8.0",
    "six==1.17.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    # Downstream reqs from pytest, to delete later
    "iniconfig==2.0.0",
    "packaging==24.2",
    "pluggy==1.5.0"
]
